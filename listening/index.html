<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>精听训练 · AI Learn</title>
<link rel="stylesheet" href="style.css">
<style>
.ielts-track{position:relative;height:12px;background:#e9e9ee;border-radius:6px;margin:30px 2px 4px}
.ielts-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#4a90d9,#30d158)}
.ielts-mark{position:absolute;top:50%;width:6px;height:6px;border-radius:50%;background:#fff;border:1.5px solid #bbb;transform:translate(-50%,-50%);z-index:1}
.ielts-dot{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #4a90d9;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.25);z-index:2}
.ielts-bubble{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;font-size:12px;padding:3px 8px;border-radius:8px;white-space:nowrap}
.ielts-ticks{position:relative;height:18px;margin:2px 2px 0}
.ielts-tick{position:absolute;transform:translateX(-50%);font-size:11px;color:#888;white-space:nowrap}
.ielts-tick.first{transform:none}
.ielts-tick.last{transform:translateX(-100%)}
.ielts-note{font-size:13px;color:#555;margin-top:6px;line-height:1.6}
.ielts-sub{color:#999;font-size:12px}
</style>
</head>
<body>
<header>
  <a href="../" class="back">← 主页</a>
  <h1>🎧 精听训练</h1>
  <p class="subtitle">每天 15 分钟，解决“认识单词但听不出来”</p>
</header>

<main id="app">
  <section id="view-home" class="view">
    <!-- IELTS 7.0 进度条 -->
    <div id="ielts-bar" class="card"><div class="meta">加载中…</div></div>

    <!-- 今日大卡片：精听入口 -->
    <div id="today-card" class="card today"></div>

    <!-- 今日推荐思路：默认折叠，点查看展开 -->
    <div id="rationale-wrap"></div>

    <!-- 为你推荐 -->
    <h2 style="margin:14px 0 8px;font-size:1rem">为你推荐</h2>
    <div id="rec-list"></div>
    <a href="englishpod.html" style="display:flex;justify-content:space-between;align-items:center;text-decoration:none;background:linear-gradient(135deg,#1d1d1f,#3a3a3c);color:#fff;border-radius:12px;padding:1.1rem;margin-bottom:1rem;box-shadow:0 1px 4px rgba(0,0,0,.15)">
      <div><div style="font-size:1.05rem;font-weight:bold">📻 EnglishPod365 每日一课</div><div style="font-size:.85rem;color:#ccc;margin-top:4px">换个材料练耳朵：每天一章，对话 + 生词 + 跟读</div></div>
      <div style="font-size:1rem;color:#7dd3fc;white-space:nowrap">去上课 →</div>
    </a>

    <h2 style="margin:14px 0 8px;font-size:1rem">历史记录</h2>
    <div id="history-list"></div>
  </section>
</main>

<footer>
  <p>sunchaohai · AI Learn</p>
</footer>

<script src="app.js"></script>
</body>
</html>
