<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📻 EnglishPod365 每日一课</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#333;max-width:800px;margin:0 auto;padding:20px}
h1{font-size:1.4em;margin-bottom:4px}
h3{font-size:1.05em;margin-bottom:10px}
.subtitle{color:#888;font-size:.9em;margin-bottom:16px}
.back{color:#4a90d9;text-decoration:none;font-size:14px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
audio{width:100%;margin:8px 0}
.btn{display:inline-block;background:#4a90d9;color:#fff;border:none;border-radius:8px;padding:10px 28px;font-size:15px;cursor:pointer;margin-top:12px;margin-right:8px}
.btn:hover{background:#3a7bc0}
.btn:disabled{background:#ccc;cursor:default}
.btn.secondary{background:#eee;color:#333}
.btn.ghost{background:#fff;color:#4a90d9;border:1px solid #4a90d9}
.view{display:none}
.view.active{display:block}
.step-badge{display:inline-block;background:#e8f1fc;color:#2b6cb0;font-size:12px;border-radius:20px;padding:2px 12px;margin-bottom:10px}
.timer{font-size:13px;color:#888;margin-top:8px}
.status{font-size:13px;color:#888;margin-top:8px}
.done-check{font-size:3em;text-align:center;margin:10px 0}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:15px}
.summary-row:last-child{border-bottom:none}
.summary-row .k{color:#666}
.summary-row .v{font-weight:600}
select.chap{font-size:15px;padding:8px 12px;border-radius:8px;border:1px solid #ccc;max-width:100%}
.done-banner{background:#e6f7ee;border:1px solid #bfe6cf;color:#1c7a3d;border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14px;line-height:1.8}
.flip-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.flip-card{perspective:700px;cursor:pointer;min-height:120px;-webkit-tap-highlight-color:transparent}
.flip-inner{position:relative;width:100%;height:100%;min-height:120px;transition:transform .45s;transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;padding:12px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.flip-front{background:#e8f1fc}
.flip-front .w{font-weight:700;font-size:16px;color:#1a56db;line-height:1.4}
.flip-front .pos{color:#888;font-size:12px}
.flip-front .tap{color:#2b6cb0;font-size:11px;margin-top:4px}
.flip-back{background:#fff7e6;transform:rotateY(180deg);font-size:14px;line-height:1.7;color:#5a4a1f}
.transcript{background:#fafafa;border:1px solid #eee;border-radius:8px;padding:12px;white-space:pre-line;line-height:1.9;font-size:15px;margin:10px 0}
.locked-note{font-size:13px;color:#999;background:#f5f5f5;border-radius:8px;padding:10px 12px;margin-top:8px}
@media (max-width:480px){.flip-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<a href="./" class="back">← 听力首页</a>
<h1>📻 EnglishPod365 每日一课</h1>
<div class="subtitle">每天一章：盲听抓大意 → 学 Key Vocabulary → 对照文本跟读</div>
<div style="margin:8px 0 4px"><label style="font-size:14px;color:#555">选择章节：</label>
<select id="chapSelect" class="chap" onchange="selectChapter(this.value)"></select></div>

<!-- ============ 训练 ============ -->
<div id="view-train">
  <!-- 开始 -->
  <div class="card view active" id="v-start">
    <div class="step-badge">今日课程</div>
    <h3 id="chapTitle">加载中…</h3>
    <p class="status" id="chapMeta" style="margin-bottom:8px"></p>
    <div class="done-banner" id="doneBanner" style="display:none"></div>
    <p class="status" style="line-height:1.8">三步走：盲听 → 学词汇（翻卡片）→ 跟读打卡。</p>
    <button class="btn" id="startBtn" onclick="startChapter()">开始学习</button>
    <a class="btn secondary" id="pdfLink" href="#" target="_blank" style="text-decoration:none">📕 PDF 讲义</a>
  </div>

  <!-- 步骤1 盲听 -->
  <div class="card view" id="v-s1">
    <div class="step-badge">步骤 1 / 3 · 盲听</div>
    <h3>👂 先盲听 2 遍，抓大意</h3>
    <p class="status">谁在跟谁谈什么？不用每个词都懂。</p>
    <audio id="s1Player" controls preload="metadata"></audio>
    <div class="timer">播放次数：<span id="s1Plays">0</span></div><br>
    <button class="btn" onclick="goStep(2)">我已听完 →</button>
  </div>

  <!-- 步骤2 词汇 -->
  <div class="card view" id="v-s2">
    <div class="step-badge">步骤 2 / 3 · 学词汇</div>
    <h3>📖 Key Vocabulary</h3>
    <p class="status">点卡片翻面看中文释义，翻完再下一步</p>
    <div class="flip-grid" id="vocabGrid"></div>
    <div class="timer">已翻开 <span id="flipCount">0</span> / <span id="flipTotal">0</span></div><br>
    <button class="btn" id="toS3Btn" onclick="goStep(3)" disabled>记住了，下一步 →</button>
    <div class="locked-note" id="flipHint">把卡片都翻开才能解锁下一步</div>
  </div>

  <!-- 步骤3 跟读 -->
  <div class="card view" id="v-s3">
    <div class="step-badge">步骤 3 / 3 · 跟读</div>
    <h3>🗣️ 对照文本跟读 1–2 遍</h3>
    <audio id="s3Player" controls preload="metadata"></audio>
    <div class="transcript" id="transcriptBox"></div>
    <button class="btn" id="doneBtn" style="background:#22a06b" onclick="finishChapter()">完成打卡 ✅</button>
    <div class="status" id="doneStatus"></div>
  </div>

  <!-- 完成 -->
  <div class="card view" id="v-done">
    <div class="done-check">🎉</div>
    <h3 style="text-align:center">本章完成</h3>
    <div id="doneSummary"></div>
    <div style="text-align:center;margin-top:8px">
      <button class="btn ghost" onclick="location.href='./'">返回听力首页</button>
      <button class="btn secondary" onclick="restartChapter()">再学一次</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://qydtzdewqkzonzwmxapa.supabase.co";
const SUPABASE_KEY = "sb_publishable_979g0z6Xf84og_vjDliW-Q_Jyia_y4N";
const SBH = {"apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json"};

let chapters = [];
let chapter = null;
let flipped = new Set();

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function showView(id){
  document.querySelectorAll("#view-train .view").forEach(v => v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

async function load(){
  try{
    const d = await (await fetch("englishpod/data.json")).json();
    chapters = d.chapters.slice().reverse(); // 最新在前
    const sel = document.getElementById("chapSelect");
    sel.innerHTML = chapters.map(c =>
      `<option value="${c.id}">${c.id}｜${esc(c.title)}</option>`).join("");
    selectChapter(chapters[0].id);
  }catch(e){
    document.getElementById("chapTitle").textContent = "加载失败，请刷新重试";
  }
}
function selectChapter(id){
  chapter = chapters.find(c => c.id === id) || chapters[0];
  document.getElementById("chapSelect").value = chapter.id;
  flipped = new Set();
  renderStart();
  checkCompletion();
}
function renderStart(){
  document.getElementById("chapTitle").textContent = `${chapter.id}｜${chapter.title}`;
  document.getElementById("chapMeta").textContent = `${chapter.date} · ${chapter.vocabulary.length} 个生词`;
  document.getElementById("pdfLink").href = chapter.pdf;
  document.getElementById("doneBanner").style.display = "none";
  document.getElementById("startBtn").textContent = "开始学习";
  showView("v-start");
}
async function checkCompletion(){
  const banner = document.getElementById("doneBanner");
  try{
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/englishpod_completions?chapter=eq.${encodeURIComponent(chapter.id)}&select=completed_at`,
      {headers: SBH});
    if(!r.ok) throw new Error("http "+r.status);
    const rows = await r.json();
    if(rows.length){
      const dt = new Date(rows[0].completed_at);
      const ds = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
      banner.style.display = "block";
      banner.innerHTML = `✅ 本章已于 ${ds} 打卡完成<br><button class="btn small secondary" style="margin-top:8px;padding:6px 14px;font-size:13px" onclick="document.getElementById('doneBanner').style.display='none';document.getElementById('startBtn').textContent='重新练习'">重新练习</button>`;
      document.getElementById("startBtn").textContent = "重新练习";
    }
  }catch(e){ /* 云端不可用时静默跳过，不阻塞学习 */ }
}

function startChapter(){
  // 步骤1
  const p1 = document.getElementById("s1Player");
  p1.src = chapter.dialogue_audio;
  document.getElementById("s1Plays").textContent = "0";
  showView("v-s1");
}
document.getElementById("s1Player").addEventListener("play", ()=>{
  const el = document.getElementById("s1Plays");
  el.textContent = parseInt(el.textContent||"0")+1;
});

function goStep(n){
  if(n === 2){
    // 步骤2：翻卡片
    flipped = new Set();
    const g = document.getElementById("vocabGrid");
    g.innerHTML = chapter.vocabulary.map((v,i)=>`
      <div class="flip-card" id="fc${i}" onclick="flipCard(${i})">
        <div class="flip-inner">
          <div class="flip-face flip-front">
            <span class="w">${esc(v.word)}</span>
            <span class="pos">${esc(v.pos||"")}</span>
            <span class="tap">👆 点我翻面</span>
          </div>
          <div class="flip-face flip-back">${esc(v.meaning)}</div>
        </div>
      </div>`).join("");
    document.getElementById("flipTotal").textContent = chapter.vocabulary.length;
    document.getElementById("flipCount").textContent = "0";
    document.getElementById("toS3Btn").disabled = true;
    document.getElementById("flipHint").style.display = "block";
    showView("v-s2");
  }else if(n === 3){
    document.getElementById("s3Player").src = chapter.dialogue_audio;
    document.getElementById("transcriptBox").textContent = chapter.transcript;
    document.getElementById("doneStatus").textContent = "";
    document.getElementById("doneBtn").disabled = false;
    showView("v-s3");
  }
}
function flipCard(i){
  const el = document.getElementById("fc"+i);
  if(!el.classList.contains("flipped")){
    el.classList.add("flipped");
    flipped.add(i);
    document.getElementById("flipCount").textContent = flipped.size;
    if(flipped.size >= chapter.vocabulary.length){
      document.getElementById("toS3Btn").disabled = false;
      document.getElementById("flipHint").style.display = "none";
    }
  }else{
    el.classList.remove("flipped");
  }
}

async function finishChapter(){
  const btn = document.getElementById("doneBtn");
  const st = document.getElementById("doneStatus");
  btn.disabled = true;
  st.textContent = "打卡中…";
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/englishpod_completions`, {
      method: "POST",
      headers: {...SBH, "Prefer": "resolution=merge-duplicates,return=minimal"},
      body: JSON.stringify({chapter: chapter.id})
    });
    if(!r.ok) throw new Error("http "+r.status);
    st.textContent = "✅ 打卡成功";
  }catch(e){
    st.textContent = "⚠️ 打卡失败（云端表可能还没建好），稍后再试";
    btn.disabled = false;
    return;
  }
  const row = (k,v)=>`<div class="summary-row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  document.getElementById("doneSummary").innerHTML =
    row("章节", `${chapter.id}｜${esc(chapter.title)}`) +
    row("生词", `${chapter.vocabulary.length} 个`) +
    row("状态", "已打卡 ✅");
  showView("v-done");
}
function restartChapter(){
  renderStart();
}

load();
</script>
</body>
</html>
