<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读训练 - AI Learn</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#333;max-width:800px;margin:0 auto;padding:20px}
h1{font-size:1.4em;margin-bottom:4px}
h3{font-size:1.05em;margin-bottom:10px}
.subtitle{color:#888;font-size:.9em;margin-bottom:16px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.btn{display:inline-block;background:#4a90d9;color:#fff;border:none;border-radius:8px;padding:10px 28px;font-size:15px;cursor:pointer;margin-top:12px;margin-right:8px}
.btn:hover{background:#3a7bc0}
.btn:disabled{background:#ccc;cursor:default}
.btn.secondary{background:#eee;color:#333}
.btn.ghost{background:#fff;color:#4a90d9;border:1px solid #4a90d9}
.status{color:#888;font-size:.88em;margin-top:10px;line-height:1.6}
.step-badge{display:inline-block;background:#eef4fb;color:#4a90d9;font-size:.8em;font-weight:bold;padding:3px 10px;border-radius:20px;margin-bottom:10px}
.hidden{display:none!important}
/* 顶部计时环 */
.timer-row{display:flex;align-items:center;gap:16px}
.ring-wrap{position:relative;width:72px;height:72px;flex:none}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#e8edf2;stroke-width:7}
.ring-fg{fill:none;stroke:#34c759;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.78em;font-weight:bold;color:#333;text-align:center;line-height:1.25}
.timer-info{font-size:.92em;color:#555;line-height:1.7}
.timer-info b{color:#1d1d1f}
/* 文章头 */
.art-title{font-size:1.25em;font-weight:bold;line-height:1.45;margin-bottom:6px}
.art-meta{color:#888;font-size:.85em;margin-bottom:10px}
.art-meta a{color:#4a90d9;text-decoration:none}
.reason{background:#fff8e6;border-left:4px solid #ff9f0a;border-radius:8px;padding:12px 14px;font-size:.93em;line-height:1.7}
/* 生词预习 */
details.vocab-box summary{cursor:pointer;font-weight:bold;font-size:1em;color:#333;outline:none}
.v-item{margin-top:10px;font-size:.92em}
.v-item .w{font-weight:bold}
.v-item .p{color:#888;font-size:.85em;margin:0 4px}
/* 正文 */
.sec{margin-bottom:22px}
.sec h4{font-size:1.02em;margin-bottom:8px;color:#1d1d1f;border-left:3px solid #4a90d9;padding-left:8px}
.sec p{font-size:1.02em;line-height:1.95;margin-bottom:12px;color:#222}
.sec p .w{border-bottom:1px dotted #b9c8d8;cursor:pointer}
.sec p .w:active{background:#fff3bf}
.sec p .w.tapped{border-bottom:1px solid #ff9f0a;background:#fff8e6}
/* 查词弹层 */
#lookup{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;width:min(92vw,560px);background:#1d1d1f;color:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:50}
#lookup .lw{font-size:1.1em;font-weight:bold}
#lookup .lp{color:#9ecbff;font-size:.85em;margin-left:6px}
#lookup .lm{margin-top:6px;font-size:.95em;line-height:1.6;color:#eee}
#lookup .lx{position:absolute;top:8px;right:12px;color:#aaa;font-size:1.2em;cursor:pointer;background:none;border:none}
/* 测试 */
.q-opt{display:block;width:100%;text-align:left;background:#f5f7fa;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 14px;font-size:.98em;margin-bottom:10px;cursor:pointer;line-height:1.55}
.q-opt.sel{border-color:#4a90d9;background:#eef4fb}
.q-opt.right{border-color:#34c759;background:#eafaf0}
.q-opt.wrong{border-color:#ff3b30;background:#fdeeee}
.q-prog{color:#888;font-size:.85em;margin-bottom:8px}
.score-big{font-size:2em;font-weight:bold;text-align:center;margin:6px 0}
.review-item{border-top:1px solid #eee;padding:10px 0;font-size:.92em;line-height:1.65}
.review-item .rq{font-weight:bold}
.review-item .rex{color:#666}
.chip{display:inline-block;background:#fff8e6;border:1px solid #ffd60a;border-radius:16px;padding:2px 10px;font-size:.85em;margin:3px 4px 3px 0}
/* 历史 */
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:.92em;gap:10px}
.hist-row:last-child{border-bottom:none}
.hist-row .ht{font-weight:bold}
.hist-row .hd{color:#888;font-size:.82em}
.hist-badge{font-size:.82em;white-space:nowrap}
/* 词组：与单词明显区分（实线下划线+浅蓝底） */
.sec p .w.phrase{border-bottom:2px solid #4a90d9;background:#eef4fb;border-radius:3px;padding:0 2px}
.sec p .w.phrase.tapped{border-bottom-color:#ff9f0a;background:#fff3bf}
/* 生词预习标签 */
.v-tag{display:inline-block;font-size:.72em;font-weight:bold;border-radius:10px;padding:1px 8px;margin-left:6px}
.v-tag.phrase{background:#e3f0ff;color:#1f6fd0;border:1px solid #bcd8f7}
.v-tag.word{background:#f1f3f5;color:#888;border:1px solid #e2e8f0}
/* 查词弹窗词组徽标 */
#lookup .lbadge{display:inline-block;background:#4a90d9;color:#fff;font-size:.66em;border-radius:9px;padding:1px 8px;margin-left:7px;vertical-align:2px}
/* 标注：正文重点词黄高亮（与 tapped 橙下划线区分） */
.sec p .w.marked{background:#fff3bf;border-bottom:2px solid #f5c518}
.sec p .w.phrase.marked{background:#fff3bf;border-bottom-color:#f5c518}
/* 重点句 */
.sec p .sent.marked{background:#fff3bf;border-radius:3px}
.sent-mark{background:none;border:none;cursor:pointer;font-size:.7em;opacity:.3;padding:0 2px;line-height:1}
.sent-mark:hover{opacity:.8}
.sent-mark.on{opacity:1}
/* 弹窗 ⭐ 按钮 */
#lkMark{margin-top:10px;background:#2c2c2e;color:#ffd60a;border:1px solid #555;border-radius:8px;padding:6px 14px;font-size:.88em;cursor:pointer}
#lkMark.on{background:#ffd60a;color:#1d1d1f;border-color:#ffd60a;font-weight:bold}
/* 我的记录卡 */
.mark-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:.92em;line-height:1.6}
.mark-row:last-child{border-bottom:none}
.mark-row .mw{font-weight:bold}
.mark-row .mm{color:#666;font-size:.9em}
.mark-row .mc{color:#999;font-size:.82em;white-space:nowrap}
.mark-row .unmark{flex:none;background:none;border:1px solid #ddd;color:#888;border-radius:6px;padding:2px 9px;font-size:.8em;cursor:pointer}
.mark-sub{font-weight:bold;margin:12px 0 2px;color:#333}
.mark-sub:first-child{margin-top:0}
details.all-marks summary{cursor:pointer;font-weight:bold;color:#4a90d9;margin-top:14px;outline:none}
.all-marks .am-art{color:#888;font-size:.82em;margin-top:10px}
/* 计时恢复提示条 + 归零按钮 */
#resumeBar{margin-top:10px;background:#fff8e1;border:1px solid #ffe08a;border-radius:8px;padding:8px 12px;font-size:.88em;color:#7a5b00}
#resumeBar button{margin-left:8px;cursor:pointer}
#timerReset{font-size:.85em;color:#888;background:none;border:1px solid #ddd;border-radius:6px;padding:2px 8px;cursor:pointer;margin-left:8px}
</style>
</head>
<body>
<div style="display:flex;gap:10px;margin-bottom:12px">

</div>
<h1>📖 阅读训练</h1>
<div class="subtitle">每天一篇，沉浸 30 分钟 · 读完测试打卡</div>

<!-- 计时 -->
<div class="card" id="timerCard">
  <div class="timer-row">
    <div class="ring-wrap">
      <svg width="72" height="72"><circle class="ring-bg" cx="36" cy="36" r="30"/><circle class="ring-fg" id="ringFg" cx="36" cy="36" r="30" stroke-dasharray="188.5" stroke-dashoffset="188.5"/></svg>
      <div class="ring-txt" id="ringTxt">0′</div>
    </div>
    <div class="timer-info" id="timerInfo">今日目标：沉浸阅读 <b>30 分钟</b><button id="timerReset" type="button">↺ 归零</button><br>计时在页面切后台时自动暂停；重新进入默认延续上次进度。</div>
  </div>
  <div id="resumeBar" class="hidden">已恢复上次进度 <b id="resumeMin">0</b> 分钟，正在继续计时。<button id="resumeOk" type="button">继续</button><button id="resumeRestart" type="button">重新开始</button></div>
</div>

<!-- 文章 -->
<div id="articleWrap">
  <div class="card" id="artHead"><div class="status">加载今日文章中…</div></div>
  <div class="card hidden" id="vocabCard">
    <details class="vocab-box" id="vocabBox">
      <summary>🗂 生词预习（先扫一眼，读起来顺很多）</summary>
      <div id="vocabList"></div>
    </details>
  </div>
  <div class="card hidden" id="artBody"></div>
</div>

<!-- 测试入口 -->
<div class="card hidden" id="quizGate">
  <div class="step-badge">读完打卡</div>
  <h3>🧪 理解测试（4 题）</h3>
  <p class="status" style="margin-top:0">答题时原文会锁定——靠理解，不靠回看抄。≥60 分 = 今日阅读打卡 ✅</p>
  <button class="btn" id="startQuizBtn" disabled>开始测试</button>
  <div class="status" id="gateHint"></div>
</div>

<!-- 测试 -->
<div class="card hidden" id="quizWrap">
  <div class="step-badge">理解测试</div>
  <div class="q-prog" id="qProg"></div>
  <h3 id="qText" style="line-height:1.6"></h3>
  <div id="qOpts"></div>
  <button class="btn" id="qNext" disabled>下一题 →</button>
  <button class="btn ghost" id="peekBtn">👀 回看原文</button>
  <div class="status" id="qHint"></div>
</div>

<!-- 结果 -->
<div class="card hidden" id="resultWrap"></div>

<!-- 我的记录 -->
<div class="card hidden" id="marksCard">
  <h3>📌 我的记录</h3>
  <div id="marksBody"><div class="status">加载中…</div></div>
  <details class="all-marks" id="allMarksBox">
    <summary>⭐ 全部重点（跨文章复习）</summary>
    <div id="allMarksBody"><div class="status">展开后加载…</div></div>
  </details>
</div>

<!-- 历史 -->
<div class="card">
  <h3>📚 阅读记录</h3>
  <div class="status" style="margin-top:0">点一行打开那篇往期文章，可正常点词、标重点、测试打卡。</div>
  <div id="histList"><div class="status">加载中…</div></div>
</div>

<div id="lookup" class="hidden">
  <button class="lx" id="lookupClose">×</button>
  <div><span class="lw" id="lkWord"></span><span class="lp" id="lkPos"></span></div>
  <div class="lm" id="lkMean">查词中…</div>
  <button id="lkMark" type="button">⭐ 标为重点</button>
</div>

<footer style="text-align:center;color:#999;font-size:.8rem;padding:1rem 0">sunchaohai · AI Learn</footer>
<script>
const SUPABASE_URL = "https://qydtzdewqkzonzwmxapa.supabase.co";
const SUPABASE_KEY = "sb_publishable_979g0z6Xf84og_vjDliW-Q_Jyia_y4N";
const SBH = {"apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json"};
const TARGET_SEC = 30 * 60; // 每日沉浸目标 30 分钟

function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function todayStr(){ const d = new Date(), p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function fmtMin(s){ const m = Math.floor(s/60); return m + "′"; }

let article = null, vocabMap = {}, tapped = new Set();
let elapsed = 0, curSec = null, sectionSecs = {};
let clockStarted = false;
let phraseList = [];  // vocab 中含空格的词组（小写，长→短），正文优先整组匹配
let answers = [], qIdx = 0, sessionSaved = false, extMode = false;

// ---------- 计时 ----------
function startClock(){
  setInterval(() => {
    if (document.hidden || !article) return;
    elapsed++;
    if (curSec != null) sectionSecs[curSec] = (sectionSecs[curSec] || 0) + 1;
    if (elapsed % 5 === 0) { renderRing(); saveTimer(); }
    if (elapsed % 10 === 0) refreshGate();
  }, 1000);
}
function renderRing(){
  const p = Math.min(elapsed / TARGET_SEC, 1);
  document.getElementById("ringFg").style.strokeDashoffset = (188.5 * (1 - p)).toFixed(1);
  document.getElementById("ringTxt").textContent = fmtMin(elapsed);
}
function refreshGate(){
  const btn = document.getElementById("startQuizBtn"), hint = document.getElementById("gateHint");
  if (extMode) {
    if (elapsed >= 1800) { if (btn.disabled) { btn.disabled = false; hint.textContent = "⏰ 已读满 30 分钟，可以打卡了。"; } }
    else { btn.disabled = true; hint.textContent = `外链模式：已读 ${Math.floor(elapsed/60)} / 30 分钟，读满后在本页打卡。`; }
    return;
  }
  if (!article || !article.quiz || article.quiz.length === 0) return;
  const need = Math.floor((article.est_minutes || 10) * 60 * 0.4);
  if (elapsed >= need) {
    if (btn.disabled) { btn.disabled = false; hint.textContent = "⏰ 阅读时长已达标，可以开始测试了。"; }
  } else {
    btn.disabled = true;
    hint.textContent = "⏳ 还需阅读约 " + Math.ceil((need - elapsed) / 60) + " 分钟才能解锁测试（防止秒点）。";
  }
}

// ---------- 取文章 ----------
async function loadArticle(pickId){
  const t = todayStr();
  let rows = [];
  try {
    if (pickId) {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/reading_articles?id=eq.${encodeURIComponent(pickId)}`, {headers: SBH});
      if (r.ok) rows = await r.json();
    } else {
      let r = await fetch(`${SUPABASE_URL}/rest/v1/reading_articles?read_date=eq.${t}&order=created_at.desc&limit=1`, {headers: SBH});
      if (r.ok) rows = await r.json();
      if (!rows.length) {
        r = await fetch(`${SUPABASE_URL}/rest/v1/reading_articles?order=read_date.desc&limit=1`, {headers: SBH});
        if (r.ok) rows = await r.json();
      }
    }
  } catch (e) { /* 降级：准备中 */ }
  if (!rows.length) {
    document.getElementById("artHead").innerHTML = `<div class="status">🕐 今日文章还在准备中，稍后再来。</div>`;
    return;
  }
  article = rows[0];
  // 切文章：回到阅读视图，复位全部单篇状态（计时共用一个 interval，只启动一次）
  document.getElementById("articleWrap").classList.remove("hidden");
  document.getElementById("quizWrap").classList.add("hidden");
  document.getElementById("resultWrap").classList.add("hidden");
  elapsed = 0; sectionSecs = {}; curSec = null; sessionSaved = false;
  extMode = false;
  const sqb = document.getElementById("startQuizBtn");
  sqb.textContent = "开始测试"; sqb.onclick = startQuiz; sqb.disabled = true;
  renderArticle();
  loadMarks();
  document.getElementById("quizGate").classList.remove("hidden");
  restoreTimer();
  renderRing();
  if (!clockStarted) { startClock(); clockStarted = true; }
  observeSections();
  refreshGate();
  loadHistory();
  window.scrollTo({top: 0, behavior: "smooth"});
}

// ---------- 计时持久化（重进默认延续，可归零） ----------
function timerKey(){ return article ? "reading_timer:" + article.id + ":" + (article.read_date || todayStr()) : null; }
function saveTimer(){ const k = timerKey(); if (k) { try { localStorage.setItem(k, String(elapsed)); } catch(e){} } }
function clearTimer(){ const k = timerKey(); if (k) { try { localStorage.removeItem(k); } catch(e){} } }
function restoreTimer(){
  const k = timerKey(); if (!k) return;
  let saved = 0;
  try { saved = parseInt(localStorage.getItem(k) || "0", 10) || 0; } catch(e){}
  if (saved >= 30) {
    elapsed = saved;
    renderRing();
    document.getElementById("resumeMin").textContent = Math.floor(saved / 60);
    document.getElementById("resumeBar").classList.remove("hidden");
  }
}
function resetTimer(){
  elapsed = 0; sectionSecs = {};
  saveTimer(); renderRing(); refreshGate();
  document.getElementById("resumeBar").classList.add("hidden");
}
document.addEventListener("visibilitychange", () => { if (document.hidden) saveTimer(); });
window.addEventListener("pagehide", saveTimer);
document.getElementById("resumeOk").onclick = () => document.getElementById("resumeBar").classList.add("hidden");
document.getElementById("resumeRestart").onclick = () => resetTimer();
document.getElementById("timerReset").onclick = () => { if (confirm("把这篇的阅读计时清零重计？")) resetTimer(); };

// ---------- 渲染 ----------
function renderArticle(){
  const a = article;
  document.getElementById("artHead").innerHTML = `
    <div class="step-badge">${(a.read_date || "") === todayStr() ? "今日阅读" : "往期阅读 · " + esc(a.read_date || "")} · ${esc(a.level || "")}</div>
    <div class="art-title">${esc(a.title)}</div>
    <div class="art-meta">${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">来源：${esc(a.source || "原文")}</a>` : "来源：" + esc(a.source || "站内")} · 约${a.word_count || "?"}词 · 预计${a.est_minutes || "?"}分钟 · ${esc(a.read_date || "")}</div>
    <div class="reason">📋 推荐理由：${esc(a.reason_cn || "")}</div>
    ${(a.read_date || "") === todayStr() ? "" : `<button class="btn ghost" style="margin-top:8px" onclick="loadArticle()">← 回今日文章</button>`}
    <div class="status" style="margin-top:8px">💡 点词查释义 · 弹窗里点 ⭐ 标重点 · 句尾点 📌 标重点句</div>`;
  // 生词预习
  const v = a.vocab || [];
  vocabMap = {};
  v.forEach(x => { vocabMap[String(x.word).toLowerCase()] = x; });
  phraseList = v.filter(x => String(x.word || "").trim().includes(" "))
    .map(x => String(x.word).toLowerCase().trim())
    .sort((p, q) => q.length - p.length);
  if (v.length) {
    document.getElementById("vocabCard").classList.remove("hidden");
    document.getElementById("vocabList").innerHTML = v.map(x => {
      const isPh = String(x.word || "").includes(" ") || x.pos === "词组";
      const tag = isPh ? `<span class="v-tag phrase">词组</span>` : `<span class="v-tag word">单词</span>`;
      return `<div class="v-item"><span class="w">${esc(x.word)}</span>${tag}<span class="p">${isPh ? "" : esc(x.pos || "")}</span><br>${esc(x.meaning)}</div>`;
    }).join("");
  }
  // 外链降级模式
  const secs = a.sections || [];
  if (!secs.length) {
    document.getElementById("artBody").classList.remove("hidden");
    document.getElementById("artBody").innerHTML = `
      <div class="step-badge">外链阅读</div>
      <p class="status">这篇文章站内版没生成，直接去原文读；本页计时环会继续跑，读满 30 分钟后回到本页点按钮打卡。</p>
      ${a.url ? `<a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener">去原文阅读 →</a>` : ""}`;
    document.getElementById("startQuizBtn").disabled = true;
    document.getElementById("gateHint").textContent = "外链模式：读满 30 分钟后在本页打卡（不用回聊天）。";
    extMode = true;
    document.getElementById("startQuizBtn").textContent = "✅ 读满 30 分钟打卡";
    document.getElementById("startQuizBtn").onclick = extCheckin;
    return;
  }
  document.getElementById("artBody").classList.remove("hidden");
  document.getElementById("artBody").innerHTML = secs.map((s, i) => `
    <div class="sec" data-sec="${i}">
      <h4>${esc(s.heading || "Section " + (i+1))}</h4>
      ${s.paragraphs.map(p => `<p>${paraHtml(p)}</p>`).join("")}
    </div>`).join("");
}
function wordSpans(text){
  // 1) 先把词组整段切出来（长词组优先，大小写不敏感，前后须为非字母边界）
  let segs = [{ t: String(text), phrase: null }];
  for (const ph of phraseList) {
    const out = [];
    for (const s of segs) {
      if (s.phrase) { out.push(s); continue; }
      let rest = s.t;
      while (rest) {
        const idx = rest.toLowerCase().indexOf(ph);
        if (idx < 0) { out.push({ t: rest, phrase: null }); break; }
        const before = idx === 0 ? "" : rest[idx - 1];
        const after = idx + ph.length >= rest.length ? "" : rest[idx + ph.length];
        if (/[A-Za-z]/.test(before) || /[A-Za-z]/.test(after)) {
          out.push({ t: rest.slice(0, idx + 1), phrase: null });
          rest = rest.slice(idx + 1);
          continue;
        }
        if (idx > 0) out.push({ t: rest.slice(0, idx), phrase: null });
        out.push({ t: rest.slice(idx, idx + ph.length), phrase: ph });
        rest = rest.slice(idx + ph.length);
      }
    }
    segs = out;
  }
  // 2) 词组整段一个 span；其余文本沿用按词切分
  return segs.map(s => {
    if (s.phrase) return `<span class="w phrase" data-w="${esc(s.phrase)}">${esc(s.t)}</span>`;
    return s.t.split(/(\s+)/).map(tok => {
      if (/[A-Za-z]/.test(tok)) {
        const clean = tok.replace(/^[^A-Za-z']+|[^A-Za-z']+$/g, "");
        return `<span class="w" data-w="${esc(clean)}">${esc(tok)}</span>`;
      }
      return esc(tok);
    }).join("");
  }).join("");
}

// ---------- 标注记录（查词自动记录 + ⭐/📌 重点） ----------
// 数据在 Supabase reading_marks（唯一键 article_id+kind+text）；表未建好/网络失败一律静默，不挡查词。
let marksMap = {};   // key: kind + "|" + text -> 记录行
let lkCtx = null;    // 弹窗当前词/词组 {kind, text}
function escAttr(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function normText(s){ return String(s == null ? "" : s).replace(/📌/g, "").replace(/\s+/g, " ").trim(); }
function marksHeaders(extra){
  return Object.assign({}, SBH, {"Prefer": "resolution=merge-duplicates,return=minimal"}, extra || {});
}
const markWriteQ = {};   // 同一条记录的写操作串行化，防止并发 upsert 互相覆盖（2026-10-20 实测教训）
function queueUpsert(key, fields){
  markWriteQ[key] = (markWriteQ[key] || Promise.resolve()).then(() => upsertMarkFields(fields)).catch(() => {});
  return markWriteQ[key];
}
async function upsertMarkFields(fields){
  if (!article) return;
  const body = Object.assign({ article_id: article.id, read_date: article.read_date || todayStr() }, fields);
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/reading_marks?on_conflict=article_id,kind,text`,
      { method: "POST", headers: marksHeaders(), body: JSON.stringify(body) });
  } catch (e) { /* 静默 */ }
}
async function loadMarks(){
  if (!article) return;
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/reading_marks?article_id=eq.${encodeURIComponent(article.id)}&select=*`, {headers: SBH});
    if (r.ok) {
      marksMap = {};
      (await r.json()).forEach(row => { marksMap[row.kind + "|" + row.text] = row; });
    }
  } catch (e) { /* 表可能还没建好：无记录模式继续 */ }
  applyMarksToBody();
  renderMarksCard();
}
function applyMarksToBody(){
  document.querySelectorAll("#artBody .w").forEach(el => {
    const t = cleanWord(el.dataset.w || "");
    const kind = t.includes(" ") ? "phrase" : "word";
    const row = marksMap[kind + "|" + t];
    el.classList.toggle("marked", !!(row && row.marked));
  });
  document.querySelectorAll("#artBody .sent").forEach(el => {
    const row = marksMap["sentence|" + normText(el.textContent)];
    const on = !!(row && row.marked);
    el.classList.toggle("marked", on);
    const b = el.querySelector(".sent-mark");
    if (b) b.classList.toggle("on", on);
  });
}
// 查词成功后记一笔：tap_count 以内存 Map 为准 +1；释义只在新记录/为空时补（upsert 会覆盖，故带上已有释义）
function recordTap(kind, text, meaning){
  const key = kind + "|" + text;
  const old = marksMap[key];
  const row = { article_id: article ? article.id : "", read_date: article ? (article.read_date || todayStr()) : todayStr(),
    kind, text, meaning: (meaning != null ? meaning : (old ? old.meaning : null)),
    marked: old ? !!old.marked : false, tap_count: (old ? (old.tap_count || 0) : 0) + 1 };
  marksMap[key] = row;
  queueUpsert(key, { kind, text, meaning: row.meaning, tap_count: row.tap_count });
  refreshLkMarkBtn();
  renderMarksCard();
}
async function toggleMark(kind, text){
  const key = kind + "|" + text;
  const old = marksMap[key];
  const row = { article_id: article ? article.id : "", read_date: article ? (article.read_date || todayStr()) : todayStr(),
    kind, text, meaning: old ? old.meaning : null,
    marked: !(old && old.marked), tap_count: old ? (old.tap_count || 0) : 0 };
  marksMap[key] = row;
  const tFields = { kind, text, meaning: row.meaning, marked: row.marked };
  if (!old) tFields.tap_count = row.tap_count;
  await queueUpsert(key, tFields);
  applyMarksToBody();
  refreshLkMarkBtn();
  renderMarksCard();
}
function refreshLkMarkBtn(){
  const btn = document.getElementById("lkMark");
  if (!btn) return;
  if (!lkCtx) { btn.textContent = "⭐ 标为重点"; btn.classList.remove("on"); return; }
  const row = marksMap[lkCtx.kind + "|" + lkCtx.text];
  const on = !!(row && row.marked);
  btn.textContent = on ? "⭐ 已标重点（点击取消）" : "⭐ 标为重点";
  btn.classList.toggle("on", on);
}
function renderMarksCard(){
  const card = document.getElementById("marksCard");
  const body = document.getElementById("marksBody");
  if (!card || !body || !article) return;
  const rows = Object.values(marksMap);
  card.classList.remove("hidden");
  if (!rows.length) {
    body.innerHTML = `<div class="status">还没有记录。读文章时点任意词/词组查释义会自动记下来；弹窗里点 ⭐、句尾点 📌 可以标重点。</div>`;
    return;
  }
  const escT = s => esc(s);
  const trunc = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n) + "…" : s; };
  const mkRow = (r, showCancel) => `
    <div class="mark-row">
      <div><span class="mw">${escT(r.text)}</span>${r.meaning ? `<div class="mm">${escT(trunc(r.meaning, 90))}</div>` : ""}</div>
      <div style="display:flex;align-items:center;gap:8px"><span class="mc">查 ${r.tap_count || 0} 次</span>${showCancel ? `<button class="unmark" type="button" data-k="${esc(r.kind)}" data-t="${escAttr(r.text)}">取消</button>` : ""}</div>
    </div>`;
  const sentRow = (r, showCancel) => `
    <div class="mark-row">
      <div>${escT(trunc(r.text, 160))}</div>
      ${showCancel ? `<button class="unmark" type="button" data-k="sentence" data-t="${escAttr(r.text)}">取消</button>` : ""}
    </div>`;
  const starred = rows.filter(r => r.marked);
  const sWords = starred.filter(r => r.kind !== "sentence");
  const sSents = starred.filter(r => r.kind === "sentence");
  const looked = rows.filter(r => !r.marked && r.kind !== "sentence")
    .sort((a, b) => (b.tap_count || 0) - (a.tap_count || 0));
  let h = "";
  if (starred.length) {
    h += `<div class="mark-sub">⭐ 重点（${starred.length}）</div>`;
    h += sWords.map(r => mkRow(r, true)).join("");
    h += sSents.map(r => sentRow(r, true)).join("");
  }
  if (looked.length) {
    h += `<div class="mark-sub">👆 查过（${looked.length}）</div>`;
    h += looked.map(r => mkRow(r, false)).join("");
  }
  if (!h) h = `<div class="status">还没有记录。</div>`;
  body.innerHTML = h;
  body.querySelectorAll(".unmark").forEach(b => b.onclick = () => toggleMark(b.dataset.k, b.dataset.t));
}
let allMarksLoaded = false;
async function loadAllMarks(){

    if (!r.ok) throw 0;
    const rows = await r.json();

document.getElementById("allMarksBox").addEventListener("toggle", e => { if (e.target.open) loadAllMarks(); });
document.getElementById("lkMark").onclick = () => { if (lkCtx) toggleMark(lkCtx.kind, lkCtx.text); };

// ---------- 句子切分（保守：保护常见缩写与小数） ----------
const SENT_ABBR = ["Mr.", "Mrs.", "Ms.", "Dr.", "St.", "e.g.", "i.e.", "U.S.", "U.K.", "a.m.", "p.m.", "vs.", "etc."];
function splitSentences(text){
  let t = String(text);
  const PH = "\u0001";
  SENT_ABBR.forEach(a => { t = t.split(a).join(a.replace(/\./g, PH)); });
  t = t.replace(/(\d)\.(\d)/g, "$1" + PH + "$2");
  const out = [];
  let start = 0;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (c === "." || c === "!" || c === "?") {
      let j = i + 1;
      if (t[j] === '"' || t[j] === "”" || t[j] === "'") j++;
      if (j < t.length && /\s/.test(t[j])) {
        let k = j;
        while (k < t.length && /\s/.test(t[k])) k++;
        if (k < t.length && /[A-Z0-9"“]/.test(t[k])) { out.push(t.slice(start, j)); start = j; }
      }
    }
  }
  if (start < t.length) out.push(t.slice(start));
  return out.map(s => s.split(PH).join(".")).filter(s => s.trim());
}
function paraHtml(p){
  return splitSentences(p).map(s =>
    `<span class="sent">${wordSpans(s)}<button class="sent-mark" type="button" title="标为重点句">📌</button></span>`).join("");
}

// ---------- 查词 ----------
// 三层：文章词库（精编）→ 内置离线词典（ECDICT 高频2万词分片，dict/<首字母>.json）→ 外链兜底
function cleanWord(w){ return String(w||"").toLowerCase().replace(/^[^a-z']+|[^a-z']+$/g, ""); }
const shardCache = {};
function loadShard(letter){
  if (!shardCache[letter]) {
    shardCache[letter] = fetch("dict/" + letter + ".json").then(r => r.ok ? r.json() : {}).catch(() => ({}));
  }
  return shardCache[letter];
}
function stemCandidates(w){
  const out = [w];
  const add = x => { if (x && x.length >= 2 && !out.includes(x)) out.push(x); };
  if (w.endsWith("'s")) add(w.slice(0, -2));
  if (w.endsWith("ies") && w.length > 4) add(w.slice(0, -3) + "y");
  if (w.endsWith("ing") && w.length > 5) {
    const b = w.slice(0, -3); add(b); add(b + "e");
    if (b.length > 2 && b[b.length-1] === b[b.length-2]) add(b.slice(0, -1));
  }
  if (w.endsWith("ed") && w.length > 4) {
    const b = w.slice(0, -2); add(w.slice(0, -1)); add(b); add(b + "e");
    if (b.length > 2 && b[b.length-1] === b[b.length-2]) add(b.slice(0, -1));
  }
  if (w.endsWith("es") && w.length > 3) add(w.slice(0, -2));
  if (w.endsWith("s") && w.length > 3) add(w.slice(0, -1));
  return out;
}
async function dictLookup(w){
  for (const cand of stemCandidates(w)) {
    const shard = await loadShard(cand[0]);
    if (shard && shard[cand]) return { word: cand, phonetic: shard[cand][0], tr: shard[cand][1] };
  }
  return null;
}
async function lookup(word){
  const w = cleanWord(word);
  if (!w) return;
  tapped.add(w);
  const el = document.querySelectorAll(`#artBody .w[data-w="${CSS.escape(word)}"]`);
  el.forEach(e => e.classList.add("tapped"));
  const box = document.getElementById("lookup");
  box.classList.remove("hidden");
  const kw = document.getElementById("lkWord"), kp = document.getElementById("lkPos"), km = document.getElementById("lkMean");
  kw.textContent = w; kp.textContent = ""; km.textContent = "查词中…";
  lkCtx = { kind: w.includes(" ") ? "phrase" : "word", text: w };
  refreshLkMarkBtn();
  const links = `<div style="margin-top:8px;font-size:.85em"><a href="eudic://dict/${encodeURIComponent(w)}" style="color:#9ecbff;text-decoration:underline">在欧路词典打开 →</a>　<a href="https://dictionary.cambridge.org/dictionary/english-chinese-simplified/${encodeURIComponent(w)}" target="_blank" rel="noopener" style="color:#9ecbff;text-decoration:underline">剑桥词典 →</a></div>`;
  if (w.includes(" ")) {
    kw.innerHTML = esc(w) + `<span class="lbadge">词组</span>`;
    const lp = vocabMap[w];
    kp.textContent = "";
    km.innerHTML = lp ? esc(lp.meaning) + links : "这个词组暂未收录，试试下面的词典：" + links;
    recordTap("phrase", w, lp ? lp.meaning : null);
    return;
  }
  const local = vocabMap[w];
  if (local) {
    kp.textContent = local.pos || "";
    km.innerHTML = esc(local.meaning) + links;
    recordTap("word", w, local.meaning);
    return;
  }
  const hit = await dictLookup(w);
  if (hit) {
    if (hit.word !== w) kw.textContent = w + " → " + hit.word;
    kp.textContent = hit.phonetic ? "/" + hit.phonetic + "/" : "";
    km.innerHTML = esc(hit.tr) + links;
    recordTap("word", w, hit.tr);
    return;
  }
  km.innerHTML = "内置词典未收录，试试下面的词典：" + links;
  recordTap("word", w, null);
}
document.addEventListener("click", e => {
  const t = e.target;
  const sm = t.closest && t.closest(".sent-mark");
  if (sm) {
    const sent = sm.closest(".sent");
    if (sent) toggleMark("sentence", normText(sent.textContent));
    return;
  }
  const w = t.closest && t.closest("#artBody .w");
  if (w) { lookup(w.dataset.w); return; }
  // 点弹窗外（且不是词/📌/弹窗内按钮）→ 关弹窗
  const box = document.getElementById("lookup");
  if (!box.classList.contains("hidden") && !(t.closest && t.closest("#lookup"))) {
    box.classList.add("hidden");
  }
});
document.getElementById("lookupClose").onclick = () => document.getElementById("lookup").classList.add("hidden");

// ---------- 分节停留 ----------
function observeSections(){
  const io = new IntersectionObserver(es => {
    es.forEach(en => {
      const i = +en.target.dataset.sec;
      if (en.isIntersecting && en.intersectionRatio >= 0.5) curSec = i;
      else if (curSec === i && !en.isIntersecting) curSec = null;
    });
  }, {threshold: [0.5]});
  document.querySelectorAll("#artBody .sec").forEach(s => io.observe(s));
}

// ---------- 测试 ----------
document.getElementById("startQuizBtn").onclick = startQuiz;
function startQuiz(){
  answers = []; qIdx = 0;
  document.getElementById("articleWrap").classList.add("hidden");
  document.getElementById("quizGate").classList.add("hidden");
  document.getElementById("quizWrap").classList.remove("hidden");
  renderQ();
}
document.getElementById("peekBtn").onclick = () => {
  const w = document.getElementById("articleWrap");
  w.classList.toggle("hidden");
  document.getElementById("peekBtn").textContent = w.classList.contains("hidden") ? "👀 回看原文" : "🙈 收起原文";
};
function renderQ(){
  const quiz = article.quiz, q = quiz[qIdx];
  document.getElementById("qProg").textContent = `第 ${qIdx+1} / ${quiz.length} 题`;
  document.getElementById("qText").textContent = q.q;
  document.getElementById("qOpts").innerHTML = q.options.map((o, i) =>
    `<button class="q-opt" data-i="${i}">${["A","B","C","D"][i]}. ${esc(o)}</button>`).join("");
  document.getElementById("qNext").disabled = true;
  document.getElementById("qNext").textContent = qIdx === quiz.length - 1 ? "提交打分" : "下一题 →";
  document.querySelectorAll("#qOpts .q-opt").forEach(b => b.onclick = () => {
    document.querySelectorAll("#qOpts .q-opt").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel");
    answers[qIdx] = +b.dataset.i;
    document.getElementById("qNext").disabled = false;
  });
}
document.getElementById("qNext").onclick = () => {
  if (answers[qIdx] == null) return;
  if (qIdx < article.quiz.length - 1) { qIdx++; renderQ(); }
  else finishQuiz();
};
function finishQuiz(){
  const quiz = article.quiz;
  let right = 0;
  const review = quiz.map((q, i) => {
    const ok = answers[i] === q.answer;
    if (ok) right++;
    return `<div class="review-item"><div class="rq">${ok ? "✅" : "❌"} ${esc(q.q)}</div>
      <div>你的答案：${["A","B","C","D"][answers[i]]} · 正确答案：${["A","B","C","D"][q.answer]}</div>
      <div class="rex">解析：${esc(q.explain || "")}</div></div>`;
  }).join("");
  const score = Math.round(right / quiz.length * 100);
  const passed = score >= 60;
  saveSession(score, passed);
  const rw = document.getElementById("resultWrap");
  rw.classList.remove("hidden");
  document.getElementById("quizWrap").classList.add("hidden");
  const words = [...tapped];
  rw.innerHTML = `
    <div class="step-badge">测试结果</div>
    <div class="score-big" style="color:${passed ? "#34c759" : "#ff9f0a"}">${score} 分</div>
    <p class="status" style="text-align:center">${passed ? "✅ 今日阅读打卡成功！" : "😅 差一点，再读一遍试试——下面是错题解析"} · 阅读用时 ${Math.round(elapsed/60)} 分钟 · 查了 ${words.length} 个词</p>
    ${passed && words.length ? `<div style="margin-top:10px"><b>今日生词回顾：</b><br>${words.map(w=>`<span class="chip">${esc(w)}</span>`).join("")}</div>` : ""}
    ${review}
    ${passed ? "" : `<button class="btn" onclick="location.reload()">再读一遍</button><button class="btn secondary" id="retryQuiz">直接重测</button>`}`;
  const rq = document.getElementById("retryQuiz");
  if (rq) rq.onclick = () => { document.getElementById("resultWrap").classList.add("hidden"); document.getElementById("quizWrap").classList.remove("hidden"); startQuiz(); };
  rw.scrollIntoView({behavior:"smooth"});
}
function extCheckin(){
  saveSession(null, true);
  document.getElementById("articleWrap").classList.add("hidden");
  document.getElementById("quizGate").classList.add("hidden");
  const rw = document.getElementById("resultWrap");
  rw.classList.remove("hidden");
  rw.innerHTML = `<div class="step-badge">外链阅读</div>
    <div class="score-big" style="color:#34c759">✅</div>
    <p class="status" style="text-align:center">今日阅读打卡成功！沉浸阅读 ${Math.round(elapsed/60)} 分钟 · 查了 ${tapped.size} 个词</p>`;
  rw.scrollIntoView({behavior:"smooth"});
}
async function saveSession(score, passed){
  if (sessionSaved) return; sessionSaved = true;
  const secs = {};
  Object.keys(sectionSecs).forEach(k => { secs[k] = sectionSecs[k]; });
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/reading_sessions`, {
      method: "POST", headers: {...SBH, "Prefer": "return=minimal"},
      body: JSON.stringify({
        article_id: article.id, read_date: todayStr(), total_seconds: elapsed,
        section_seconds: secs, tapped_words: [...tapped], quiz_score: score, passed
      })
    });
  } catch (e) { /* 离线也显示结果，不阻塞 */ }
  if (passed) clearTimer();
}

// ---------- 历史 ----------
async function loadHistory(){
  const box = document.getElementById("histList");
  try {
    const [ar, sr] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/reading_articles?order=read_date.desc&limit=20`, {headers: SBH}),
      fetch(`${SUPABASE_URL}/rest/v1/reading_sessions?order=created_at.desc&limit=200`, {headers: SBH})
    ]);
    if (!ar.ok) throw 0;
    const arts = await ar.json();
    const sess = sr.ok ? await sr.json() : [];
    const best = {};
    sess.forEach(s => { if (!best[s.article_id]) best[s.article_id] = s; });
    if (!arts.length) { box.innerHTML = `<div class="status">还没有阅读记录。</div>`; return; }
    box.innerHTML = arts.map(a => {
      const s = best[a.id];
      const badge = s
        ? (s.passed ? `<span class="hist-badge" style="color:#34c759">✅ ${s.quiz_score}分</span>` : `<span class="hist-badge" style="color:#ff9f0a">${s.quiz_score}分·未通过</span>`)
        : `<span class="hist-badge" style="color:#888">未测</span>`;
      const cur = article && a.id === article.id;
      return `<div class="hist-row" style="cursor:pointer" onclick="loadArticle('${a.id}')"><div><div class="ht">${esc(a.title)}</div><div class="hd">${esc(a.read_date || "")} · ${esc(a.level || "")}${cur ? " · 📖 在读" : ""}</div></div>${badge}<div style="color:#2b6cb0;font-size:.85rem;white-space:nowrap">读这篇 →</div></div>`;
    }).join("");
  } catch (e) {
    box.innerHTML = `<div class="status">记录加载失败。</div>`;
  }
}

loadArticle();
loadHistory();
